# Dependabot: dependency and Actions updates, weekly, grouped. Same program as the
# other SDKs' security.yml (2026-09-08). Version updates target `dev` (not the
# GitHub default `prod`). Merge green low-risk PRs to `dev`, then promote
# `dev` → `test` → `prod`. Security-alert PRs still open against `prod`; retarget
# or cherry-pick onto `dev` — do not merge them into prod first unless the
# operator authorizes a hotfix.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # nanobind and scikit-build-core shape the compiled extension and its wheel
    # tags; a semver-major of either is a scheduled upgrade with a full wheel
    # matrix run, not a weekly bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
