# gitleaks configuration: the default ruleset plus an allowlist for the classes
# of string that are not secrets in this codebase. Same shape as the other SDKs'
# (2026-09-08). A NEW allowlist entry is a reviewed decision -- say in the PR why
# the string cannot be a live credential.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures, generated output, vendored sources, and benchmark tokens"
paths = [
  # Specs and fixtures: fake tokens with the right shape are the point of them.
  '''(^|/)test_[^/]*\.py$''',
  '''\.(spec|test)\.(ts|tsx|mts|mjs|js|cpp|sh)$''',
  '''(^|/)(test|tests|__tests__|fixtures)/''',
  # Benchmarks sign with a fixed, obviously fake 64-octet token.
  '''(^|/)benchmarks/''',
  # Generated / vendored output that is never a place a credential is written.
  '''(^|/)dist/''',
  '''(^|/)wheelhouse/''',
  '''(^|/)vendor/''',
  # Documented placeholders.
  '''(^|/)example\.env$''',
]
regexes = [
  # Tailscale addresses are not secrets.
  '''\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b''',
]
