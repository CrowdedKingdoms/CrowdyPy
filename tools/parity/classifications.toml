[methods]
# Methods of mapped classes that CrowdyPy does not have.

# --- native-equivalent
"CrowdyClient.close" = { kind = "native-equivalent", reason = "AsyncCrowdyClient.aclose(), the asyncio spelling; the blocking CrowdyClient has close()" }
"KitError.from" = { kind = "native-equivalent", reason = "KitError.from_error(error): `from` is a Python keyword" }
"ManagedPlayersAPI.deleteMany" = { kind = "native-equivalent", reason = "managed_players.remove_many(org_id, external_ids), CrowdyCPP's name for it (removeMany): the same mutation, the same 1 to 100 ids refused before any request, and MANAGED_PLAYERS_DELETE_MAX" }
"FleetNotCarriedError.code" = { kind = "native-equivalent", reason = "error.code, the attribute every CrowdyReplicationError carries: 'NotCarried', CrowdyCPP's name for the refusal (Errc::NotCarried)" }
"FleetSession.forgetActor" = { kind = "native-equivalent", reason = "CrowdyCPP's session keeps no table of a player's actors and sends no heartbeat by itself, so there is nothing to forget: the game server calls send_heartbeat(player, chunk, uuid) every 2 seconds for an idle actor and stops when the actor leaves" }
"FleetSession.settled" = { kind = "native-equivalent", reason = "CrowdyCPP verifies every datagram in its network thread before it queues it, and poll() returns once the handlers of everything queued have run; there is no pending verification to wait for" }
"FleetSession.status" = { kind = "native-equivalent", reason = "session.state, CrowdyCPP's ConnState as a player's connection reports it (the `status` handler receives it); a release by the realtime server is the session_released handler and move_ordered" }
"FleetSession.tick" = { kind = "native-equivalent", reason = "CrowdyCPP's network thread does the session's timed work (capabilities, carry sends and retries); with manual_pump=True call pump(), and poll() reports the carries nothing answered" }
"FleetSession.toJSON" = { kind = "native-equivalent", reason = "repr(session): the app, the game token id, the state, the server and the carried count, never a token" }

# --- browser-exclusion
"PortalAPI.embeddedHostInfo" = { kind = "browser-exclusion", reason = "answers whether the page runs inside the Crowdy Games shell iframe, retired 2026-10-29; a Python client never did" }
"PortalAPI.handleAuthorizeRequest" = { kind = "browser-exclusion", reason = "Studio /authorize browser-page redirect handler; a Python client uses authorization-code APIs" }
"PortalAPI.handleSignInCallback" = { kind = "browser-exclusion", reason = "the browser return leg of hosted sign-in (reads location.search, rewrites history); a Python client uses exchangeCode with the code it received" }
"PortalAPI.signIn" = { kind = "browser-exclusion", reason = "hosted sign-in navigates the browser to Studio /authorize (ck-api v1.88.0); a a Python client client sends no Origin header, signs in with auth().login and mints directly" }

[exports]
# Functions and values exported from CrowdyJS's src/index.ts.

# --- native-equivalent
"BUNDLE_HEADER_BYTES" = { kind = "native-equivalent", reason = "the same codec, CrowdyCPP's, through crowdypy.wire: crowdypy.wire.bundle() / split_datagram(), which own the bundle layout" }
"GENERIC_SPATIAL_MAX_PAYLOAD_BYTES" = { kind = "native-equivalent", reason = "the same codec, CrowdyCPP's, through crowdypy.wire: crowdypy.wire.MAX_LONG_SPATIAL_PAYLOAD" }
"BUNDLE_LENGTH_PREFIX_BYTES" = { kind = "native-equivalent", reason = "the same codec, CrowdyCPP's, through crowdypy.wire: crowdypy.wire.bundle() / split_datagram(), which own the bundle layout" }
"execWireIntegers" = { kind = "native-equivalent", reason = "msgspec writes a Python int as a msgpack integer of its width, so there is no float for a hub's integer field to refuse; @msgpack/msgpack writes a JS number of 2^32 or more as a float without it" }
"BrowserLocalStorageTokenStore" = { kind = "native-equivalent", reason = "token persistence is TokenStore / SessionStore; the localStorage backing is browser-only, and FileTokenStore mirrors its session / app key split" }
