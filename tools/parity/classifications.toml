# Reviewed classifications for tools/parity/parity.py: every difference between CrowdyJS (at
# the commit pyproject.toml pins) and CrowdyPy carries one, or the gate fails.
#
#   portable-gap       missing work. Shown as such in docs/parity-matrix.md, and what
#                      --strict refuses; the reason names the phase that closes it.
#   native-equivalent  the same contract through CrowdyPy's architecture (the native core,
#                      httpx, Python naming); the reason names where.
#   browser-exclusion  browser, DOM, iframe or Web Worker only; no Python client has one.
#
# A classification that no longer describes a difference fails the gate as stale: delete it
# when the gap closes. Kinds and reasons follow CrowdyCPP's matrix where it has a row.

[class-map]
# CrowdyJS class -> the CrowdyPy class that carries its methods.
CrowdyClient = "AsyncCrowdyClient"
GraphQLClient = "AsyncGraphQLClient"

